<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- noindex en páginas de autenticación -->
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Acceso · ITSSAT</title>
    <link rel="icon" type="image/png" href="tec.png">
    <!-- Font Awesome con SRI -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="componentes.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="animaciones.css">
</head>
<body>

<!-- PRELOADER -->
    <div class="preloader" id="preloader" aria-hidden="true" role="status">
        <div class="loader"></div>
    </div>

<!-- PANEL BIENVENIDA -->
    <div class="container-bienvenido">
        <img src="Itssat.png"
             class="logo"
             alt="Logo del Instituto Tecnológico Superior de Santiago Tuxtla"
             width="120" height="130">
        <div class="bienvenida">
            <h1 id="tituloBienvenida"></h1>
            <p  id="subtituloBienvenida"></p>
        </div>
    </div>

<!-- PANEL FORMULARIOS -->
    <div class="container-derecho">
        <div class="form-container">

            <!-- FORMULARIO 1: LOGIN -->
            <div id="loginForm" class="form-section" role="region" aria-label="Iniciar sesión">
                <div class="form-header">
                    <div class="icon-header" aria-hidden="true"><i class="fas fa-circle-user"></i></div>
                    <h2>Iniciar Sesión</h2>
                </div>
                <form id="formLogin" novalidate autocomplete="on">
                    <input type="hidden" name="accion"     value="login">
                    <input type="hidden" name="csrf_token" id="csrfLogin">

                    <div class="form-group">
                        <label for="correo" class="sr-only">Correo electrónico</label>
                        <span class="icon" aria-hidden="true">📧</span>
                        <input type="email" id="correo" name="correo"
                               placeholder="Correo Electrónico"
                               autocomplete="username"
                               maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="sr-only">Contraseña</label>
                        <span class="icon" aria-hidden="true">🔑</span>
                        <input type="password" id="password" name="password"
                               placeholder="Contraseña"
                               autocomplete="current-password"
                               maxlength="20" required>
                        <button type="button" class="toggle-password" id="togglePasswordBtn"
                                aria-label="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                    <div class="btn-group btn-group-margin">
                        <button type="submit" id="loginBtn" class="btn-login btn-verde-login">Iniciar Sesión</button>
                    </div>
                    <div class="separador"></div>
                    <div class="btn-group">
                        <button type="button" class="btn-login btn-red-login" id="irRecuperacionBtn">¿Olvidé mi Contraseña?</button>
                    </div>
                </form>
            </div>

            <!-- FORMULARIO 2: RECUPERACIÓN PASO 1 -->
            <div id="recoveryForm" class="form-section" role="region" aria-label="Recuperar contraseña">
                <div class="form-header">
                    <div class="icon-header" aria-hidden="true"><i class="fas fa-lock icon-spinning"></i></div>
                    <h2>Recuperar Contraseña</h2>
                </div>
                <p class="recovery-subtitle">Ingresa tu correo para identificarte</p>
                <form id="formRecuperar" novalidate>
                    <input type="hidden" name="accion"     value="recuperar_paso1">
                    <input type="hidden" name="csrf_token" id="csrfRecuperar">

                    <div class="form-group">
                        <label for="correo_recuperar" class="sr-only">Correo electrónico</label>
                        <span class="icon" aria-hidden="true">📧</span>
                        <input type="email" id="correo_recuperar" name="correo_recuperar"
                               placeholder="Correo Electrónico"
                               autocomplete="email"
                               maxlength="100" required>
                    </div>
                    <div class="btn-group btn-group-margin">
                        <button type="submit" class="btn-login btn-verde-login">Continuar</button>
                    </div>
                    <div class="separador"></div>
                    <div class="btn-group">
                        <button type="button" class="btn-login btn-red-login" id="irLoginBtn">Volver al Login</button>
                    </div>
                </form>
            </div>

            <!-- FORMULARIO 3: RECUPERACIÓN PASO 2 (desafío) -->
            <div id="challengeForm" class="form-section" role="region" aria-label="Verificar identidad">
                <div class="form-header">
                    <div class="icon-header" aria-hidden="true"><i class="fas fa-shield-halved"></i></div>
                    <h2>Verificar Identidad</h2>
                </div>
                <p class="recovery-subtitle">Ingresa tus credenciales secretas</p>

                <!-- Contenido dinámico: se llena con JS si hay sesión activa -->
                <div id="challengeFormContent">
                    <!-- Si hay sesión de recuperación, JS inyecta el form; si no, muestra mensaje expirado -->
                </div>
            </div>

            <!-- FORMULARIO 4: NUEVA CONTRASEÑA (paso 3) -->
            <div id="resetPassForm" class="form-section" role="region" aria-label="Nueva contraseña">
                <div id="resetPassFormContent">
                    <!-- Si hay sesión de restablecimiento, JS inyecta el form; si no, muestra mensaje expirado -->
                </div>
            </div>

        </div>
    </div>

<!-- MODAL UNIVERSAL -->
    <div class="modal-overlay"
         id="modalOverlay"
         role="dialog"
         aria-modal="true"
         aria-labelledby="modalTitle"
         aria-describedby="modalText">
        <div class="modal-content" id="modalContent">
            <i   class="modal-icon"    id="modalIcon"    aria-hidden="true"></i>
            <div class="modal-title"   id="modalTitle"   tabindex="-1"></div>
            <div class="modal-text"    id="modalText"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script src="componentes.js" defer></script>
    <script src="login.js"       defer></script>
    <script src="login-init.js"  defer></script>
</body>
</html>
